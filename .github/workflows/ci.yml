name: ci

on:
  push:
  pull_request:

jobs:
  backend-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/service/classification/backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: App/service/classification/backend-node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App/service/classification/backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: App/service/classification/backend-node/package-lock.json
      - run: npm ci
      - name: Start server and smoke test
        run: |
          node src/server.ts &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3031/health && break
            sleep 0.5
          done
          curl -fsS -X POST http://127.0.0.1:3031/classify \
            -H 'content-type: application/json' \
            -d '{"profile_id":"5000_lps","namespace":"ci-smoke","readings":[{"timestamp":"2026-10-19T10:00:00+07:00","motor_current":100,"output_frequency":40,"output_power":300,"motor_torque":80}]}' \
            | head -c 200
          echo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd App/service/classification/frontend
      - run: bun run --cwd App/service/classification/frontend typecheck
      - run: bun run --cwd App/service/classification/frontend check:deadcode
      - run: bun run --cwd App/service/classification/frontend build
